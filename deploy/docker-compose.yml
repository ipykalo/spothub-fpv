# SpotHub FPV in production: one VPS, four containers, Caddy in front.
#
# Nothing here builds. The images come from GHCR, where CI publishes them on
# every push to `master` — so a deploy is `docker compose pull && docker
# compose up -d`, and a rollback is pinning SPOTHUB_TAG to the previous sha.
#
# Run from /opt/spothub with the .env beside it:
#   docker compose --env-file .env up -d
#
# Only Caddy publishes ports. Postgres and MinIO are reachable on the internal
# network and nowhere else, which is why neither needs a firewall rule of its
# own.

name: spothub

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless if the provider's firewall drops it.
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The issued certificates. Losing this volume means re-issuing, and
      # Let's Encrypt rate-limits that — so it is a named volume, not a
      # bind mount into a directory someone might tidy up.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - client

  api:
    image: ghcr.io/ipykalo/spothub-fpv/api:${SPOTHUB_TAG:-master}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # The site's public address: where the OAuth callback sends the browser
      # back to, and the only origin CORS allows.
      CLIENT_URL: https://${SITE_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: https://${SITE_DOMAIN}/api/auth/google/callback
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # The API's own reads and writes go straight at the service, inside the
      # network. Only the URLs the browser uploads to are signed against the
      # public name — a container cannot resolve one, and the API tried to:
      # `getaddrinfo ENOTFOUND storage.<domain>` on the first commit.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-spothub-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      # Built into the API image; no Docker fallback needed here.
      BLACKBOX_DECODE_PATH: blackbox_decode
      # Official exchange rates. The defaults are the NBU's own address and
      # ten seconds; .env changes either without a new image.
      NBU_RATES_URL: ${NBU_RATES_URL:-https://bank.gov.ua/NBUStatService/v1/statdirectory/exchangenew}
      NBU_RATES_TIMEOUT_MS: ${NBU_RATES_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  client:
    image: ghcr.io/ipykalo/spothub-fpv/client:${SPOTHUB_TAG:-master}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # How this server reaches the API while rendering: inside the network,
      # never back out through the public address.
      API_INTERNAL_ORIGIN: http://api:3000
      # Angular answers any other Host header with 400. Without this the real
      # domain is refused on every request.
      NG_ALLOWED_HOSTS: ${SITE_DOMAIN}
      # Behind Caddy the scheme and host arrive in these headers. Untrusted,
      # every canonical link, og:url and sitemap entry would be built from the
      # container's own address instead of the site's.
      NG_TRUST_PROXY_HEADERS: x-forwarded-proto,x-forwarded-host
    depends_on:
      - api

  postgres:
    # The same image as development, pinned: a major version is a migration.
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # A cold start on a small box takes longer than the interval allows for.
      start_period: 30s

  minio:
    # MinIO's own images are gone — withdrawn from Docker Hub in 2025 and from
    # quay in November 2026, with its repository archived. Chainguard still
    # builds it from source. Pinned by digest, the same one CI runs its
    # end-to-end suite against: a tag can be withdrawn or moved, which is how
    # both earlier images broke.
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    # As Chainguard's default non-root user. The volume is created fresh on the
    # server, so it belongs to that user from the start; development runs as
    # root only because its older volumes were written by a root image.
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # What the browser is redirected to; without it MinIO answers with its
      # own container address in some flows.
      MINIO_SERVER_URL: https://${STORAGE_DOMAIN}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Creates the bucket once and exits. `mb -p` is idempotent, so this is safe
  # on every `up`.
  createbuckets:
    # The same image: it carries both a shell and mc. Chainguard's own mc
    # image has no shell to run these commands in.
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb -p local/${S3_BUCKET:-spothub-media} &&
      exit 0"
    restart: "no"

  # Off-site backups, run by backup.sh and restore-test.sh — never by `up`,
  # which skips a service behind a profile. The MinIO image again, for its
  # `mc`, on this network so it reaches MinIO without a published port.
  backup:
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    profiles: [tools]
    entrypoint: ["/bin/sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-spothub-media}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    restart: "no"

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
