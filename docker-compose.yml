services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: spothub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fpv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fpv}
      POSTGRES_DB: ${POSTGRES_DB:-fpv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fpv} -d ${POSTGRES_DB:-fpv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage. Unused until the media pipeline ticket, but the
  # bucket exists from day one so nothing has to change when it lands.
  minio:
    image: minio/minio
    container_name: spothub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-spothub-media} &&
      exit 0"

volumes:
  pgdata:
  miniodata:
