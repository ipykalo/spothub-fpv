services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: spothub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fpv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fpv}
      POSTGRES_DB: ${POSTGRES_DB:-fpv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fpv} -d ${POSTGRES_DB:-fpv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage. Unused until the media pipeline ticket, but the
  # bucket exists from day one so nothing has to change when it lands.
  minio:
    # MinIO's own images are gone — withdrawn from Docker Hub in 2025 and from
    # quay in November 2026, with its repository archived. Chainguard still
    # builds it from source. Pinned by digest, not tag: a tag can be withdrawn
    # or moved, which is how both earlier images broke. CI and the production
    # stack use the same digest.
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    # Root, because a volume made before November 2026 was written by MinIO's
    # own image, which ran as root: Chainguard's default non-root user cannot
    # write to it and refuses to start. CI and production start from empty
    # drives and run as that non-root user.
    user: "0:0"
    container_name: spothub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # The same volume as before the switch: this build reads what the old
      # image wrote, in place.
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    # The same image: it carries both a shell and mc. Chainguard's own mc
    # image has no shell to run these commands in.
    image: cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-spothub-media} &&
      exit 0"

volumes:
  pgdata:
  miniodata:
