name: CI

on:
  push:
    # `dev` is where work lands and `master` is what production runs, so both
    # have to build: without `dev` here CI only ever ran on the occasional
    # release and on pull requests, and without `master` no image would be
    # published for the branch the server actually deploys.
    branches: [master, main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nx affected commands need history to compare against the base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types and lint both depend on the generated client, so this comes first.
      - name: Generate Prisma client
        run: npx prisma generate

      # Must go through Nx: flat config does not cascade, so a root `eslint
      # apps libs` run applies only the root config and silently skips every
      # Angular and template rule in apps/client/eslint.config.mjs.
      - name: Lint
        run: npx nx run-many -t lint --all --max-warnings=0

      - name: Check formatting
        run: npx prettier --check "apps/**/*.{ts,html,scss}" "libs/**/*.ts"

      - name: Typecheck
        run: |
          npx tsc -p apps/api/tsconfig.app.json --noEmit
          npx tsc -p apps/api/e2e/tsconfig.json --noEmit
          npx tsc -p apps/client/tsconfig.app.json --noEmit

      # Parser tests against real SD-card logs — the most valuable tests in
      # the codebase, because a format quirk fails silently otherwise.
      - name: Test
        run: npx nx run api:test

      - name: Build
        run: npx nx run-many -t build --projects=api,client --configuration=production

  # Real HTTP requests against a real Nest app, Postgres and MinIO — no
  # mocked repositories. See apps/api/e2e/README.md. A separate job so a slow
  # or flaky integration test never hides a plain lint/build failure in
  # `verify`, and so it gets its own service containers rather than crowding
  # that job's.
  e2e:
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: fpv
          POSTGRES_PASSWORD: fpv
          POSTGRES_DB: fpv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fpv -d fpv"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://fpv:fpv@localhost:5432/fpv?schema=public
      GOOGLE_CLIENT_ID: e2e-unused
      GOOGLE_CLIENT_SECRET: e2e-unused
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      JWT_ACCESS_SECRET: e2e-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: e2e-refresh-secret-at-least-32-characters
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: spothub-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      # MinIO is started here rather than as a service container, because it
      # needs its `server /data` argument and a service container cannot give
      # an image a command. That is why this used to be bitnami's image, whose
      # entrypoint needed no arguments — but bitnami stopped publishing those
      # tags in 2025, the pull began failing, and the whole job died before its
      # first step. Straight from MinIO's own registry now, pinned.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772 server /data
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO never became healthy"
          docker logs minio
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Every suite that measures coverage, then each area against its floor
      # (coverage.thresholds.json). This is where the e2e suite runs: the
      # runner makes its own test database and bucket from the env above, and
      # the API's real coverage only shows once that suite has run.
      - run: npm run coverage

  # Both images are built on every run, including pull requests, because a
  # Dockerfile that only breaks at release time is a Dockerfile nobody trusts.
  # Pushing to the registry is the part reserved for branches.
  images:
    needs: [verify, e2e]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for GITHUB_TOKEN to publish to GHCR.
      packages: write

    strategy:
      # One broken image should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: client
            dockerfile: apps/client/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork has no write access, and does not need it —
      # it only builds.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          # A branch tag moves with its branch — `master` is what the server
          # runs, `dev` is what the next release is being built from. The sha
          # tag is the immutable one to roll back to.
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is the repository root: both Dockerfiles copy the
          # whole workspace, because Nx builds from it.
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every run reinstalls node_modules from scratch in
          # two images.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
