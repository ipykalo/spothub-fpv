name: CI

on:
  push:
    # `dev` is where work actually lands; without it here CI only ever ran on
    # the occasional merge to main and on pull requests.
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nx affected commands need history to compare against the base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types and lint both depend on the generated client, so this comes first.
      - name: Generate Prisma client
        run: npx prisma generate

      # Must go through Nx: flat config does not cascade, so a root `eslint
      # apps libs` run applies only the root config and silently skips every
      # Angular and template rule in apps/client/eslint.config.mjs.
      - name: Lint
        run: npx nx run-many -t lint --all --max-warnings=0

      - name: Check formatting
        run: npx prettier --check "apps/**/*.{ts,html,scss}" "libs/**/*.ts"

      - name: Typecheck
        run: |
          npx tsc -p apps/api/tsconfig.app.json --noEmit
          npx tsc -p apps/api/e2e/tsconfig.json --noEmit
          npx tsc -p apps/client/tsconfig.app.json --noEmit

      # Parser tests against real SD-card logs — the most valuable tests in
      # the codebase, because a format quirk fails silently otherwise.
      - name: Test
        run: npx nx run api:test

      - name: Build
        run: npx nx run-many -t build --projects=api,client --configuration=production

  # Real HTTP requests against a real Nest app, Postgres and MinIO — no
  # mocked repositories. See apps/api/e2e/README.md. A separate job so a slow
  # or flaky integration test never hides a plain lint/build failure in
  # `verify`, and so it gets its own service containers rather than crowding
  # that job's.
  e2e:
    needs: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: fpv
          POSTGRES_PASSWORD: fpv
          POSTGRES_DB: fpv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fpv -d fpv"
          --health-interval 5s --health-timeout 5s --health-retries 10

      # docker-compose runs plain minio/minio with an explicit `server /data`
      # command; a GitHub Actions service container cannot override a image's
      # command, and that image's own default does nothing useful. bitnami's
      # image starts the server with no arguments, which is all a service
      # container can give it.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://fpv:fpv@localhost:5432/fpv?schema=public
      GOOGLE_CLIENT_ID: e2e-unused
      GOOGLE_CLIENT_SECRET: e2e-unused
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      JWT_ACCESS_SECRET: e2e-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: e2e-refresh-secret-at-least-32-characters
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: spothub-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run test:e2e

  # Both images are built on every run, including pull requests, because a
  # Dockerfile that only breaks at release time is a Dockerfile nobody trusts.
  # Pushing to the registry is the part reserved for branches.
  images:
    needs: [verify, e2e]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for GITHUB_TOKEN to publish to GHCR.
      packages: write

    strategy:
      # One broken image should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: client
            dockerfile: apps/client/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork has no write access, and does not need it —
      # it only builds.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          # `dev` and `main` are moving tags to deploy from; the sha tag is the
          # immutable one to roll back to.
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is the repository root: both Dockerfiles copy the
          # whole workspace, because Nx builds from it.
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every run reinstalls node_modules from scratch in
          # two images.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
