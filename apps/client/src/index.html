<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpotHub FPV</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The SVG for every current browser; the .ico for whatever asks for /favicon.ico by name. -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#1b1b1b" />

    <!--
      Applies the saved theme before Angular loads. ThemeStore takes over once
      the app boots, but without this a returning dark-mode visitor would get a
      white flash on every load. The key must match THEME_STORAGE_KEY.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('spothub.theme');
          var mode =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.style.colorScheme = mode;
          if (mode === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!--
      Both fonts are self-hosted, bundled through project.json's styles: Open
      Sans from @fontsource, and Material Icons — which backs <mat-icon>, whose
      default font set class is `material-icons` — from the `material-icons`
      package, filled set only. It came from Google Fonts until the site went
      public, which sent every visitor's address to Google on every page.
    -->
  </head>
  <body>
    <sh-root></sh-root>
  </body>
</html>
