<mat-card appearance="outlined" class="w-full max-w-104">
  <mat-card-header>
    <mat-card-title>SpotHub FPV</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p class="mt-0 mb-6 text-muted">Your hangar: what you built, what's in it, what it cost.</p>
    <button matButton="filled" type="button" (click)="signIn()">
      <mat-icon>login</mat-icon>
      Continue with Google
    </button>
  </mat-card-content>
</mat-card>
