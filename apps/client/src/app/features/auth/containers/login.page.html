<mat-card appearance="outlined" class="w-full max-w-104">
  <mat-card-header>
    <mat-card-title>SpotHub FPV</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p class="mt-0 mb-6 text-muted">
      Your builds, parts, flight logs, battery packs and flying spots, in one place. Signing in is by invitation for
      now.
    </p>
    <button matButton="filled" type="button" (click)="signIn()">
      <mat-icon>login</mat-icon>
      Continue with Google
    </button>
    <p class="mt-6 mb-0 text-sm text-muted">
      New here? Read <a routerLink="/about">what SpotHub FPV is</a>, or <a routerLink="/">the blog</a>.
    </p>
  </mat-card-content>
</mat-card>
