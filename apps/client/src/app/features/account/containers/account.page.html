<header class="mb-6">
  <h1 class="m-0 text-2xl">Your account</h1>
</header>

@if (auth.user(); as user) {
  <div class="grid max-w-176 gap-8">
    <sh-pilot-name-form
      [user]="user"
      [saving]="store.savingName()"
      [error]="store.nameError()"
      (save)="savePilotName($event)"
    />

    <sh-home-currency-form
      [currency]="auth.homeCurrency()"
      [error]="store.currencyError()"
      (chosen)="saveHomeCurrency($event)"
    />

    <sh-blocked-pilots
      [pilots]="blocks.blocked()"
      [saving]="blocks.saving()"
      [error]="blocks.error()"
      (unblocked)="unblock($event)"
    />

    <sh-sign-out-everywhere [busy]="signingOut()" [error]="signOutError()" (requested)="signOutEverywhere()" />

    <sh-account-details
      [user]="user"
      [storage]="store.storage()"
      [deleting]="store.deleting()"
      [error]="store.error()"
      (deleteConfirmed)="delete()"
    />
  </div>
}
