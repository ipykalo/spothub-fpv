<mat-chip-listbox aria-label="Filter by category" (change)="selectedChange.emit($any($event).value ?? null)">
  <mat-chip-option [selected]="selected() === null" [value]="null">All</mat-chip-option>

  @for (category of categories(); track category) {
    <mat-chip-option [selected]="selected() === category" [value]="category">
      <mat-icon aria-hidden="true">{{ categoryIcons[category] }}</mat-icon>
      {{ categoryLabels[category] }}
    </mat-chip-option>
  }
</mat-chip-listbox>
