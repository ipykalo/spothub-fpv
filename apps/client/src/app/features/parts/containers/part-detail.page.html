<header class="mb-5 flex flex-wrap items-start justify-between gap-4">
  <div class="min-w-0">
    <a class="inline-flex items-center gap-1 text-sm text-muted no-underline hover:underline" routerLink="/parts">
      <mat-icon class="icon-sm">arrow_back</mat-icon>
      Parts
    </a>
    <!-- The full listing name, wrapped rather than clamped as it is on the card. -->
    <h1 class="mt-1.5 mb-0 text-2xl leading-tight wrap-anywhere">{{ title() }}</h1>
  </div>

  <div class="flex items-center gap-2">
    <sh-collapse-all />
    @if (part(); as found) {
      <a matButton="outlined" [routerLink]="['/parts', found.id, 'edit']">
        <mat-icon>edit</mat-icon>
        Edit
      </a>
    }
  </div>
</header>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (failure(); as message) {
  <p role="alert">{{ message }}</p>
}

@if (part(); as found) {
  <sh-part-details
    [part]="found"
    [removingUnitId]="removingUnitId()"
    (unitConditionChanged)="setCondition($event)"
    (unitAdded)="addUnit()"
    (unitRemoved)="removeUnit($event)"
  />
}
