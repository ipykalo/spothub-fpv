<header class="mb-4">
  <h1 class="m-0 text-2xl">Admin</h1>
  <p class="mt-1 mb-0 text-sm text-muted">Changes save as you make them and apply to the next sign-in.</p>
</header>

@if (store.loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (store.error(); as message) {
  <p class="text-danger" role="alert">{{ message }}</p>
}

@if (store.settings(); as settings) {
  <!-- First: the one section that asks for something to be done. -->
  <sh-section heading="Reports" icon="flag" [count]="store.reports().length">
    <sh-reports-list [reports]="store.reports()" [saving]="store.saving()" (dismissed)="dismiss($event)" />
  </sh-section>

  <sh-section
    heading="Hidden"
    icon="visibility_off"
    storageKey="admin.hidden"
    [count]="store.hiddenPosts().length + store.hiddenComments().length"
  >
    <sh-hidden-list
      [posts]="store.hiddenPosts()"
      [comments]="store.hiddenComments()"
      [saving]="store.saving()"
      (postShown)="showPost($event)"
      (postDeleted)="deletePost($event)"
      (commentShown)="showComment($event)"
      (commentDeleted)="deleteComment($event)"
    />
  </sh-section>

  <sh-section heading="Who can sign in" icon="how_to_reg">
    <sh-sign-up-settings
      [settings]="settings"
      [saving]="store.saving()"
      (openChanged)="setOpen($event)"
      (emailAdded)="add($event)"
      (emailRemoved)="remove($event)"
    />
  </sh-section>

  <sh-section heading="Restricted countries" icon="public_off" [count]="settings.blockedCountries.length">
    <sh-restricted-countries
      [countries]="settings.blockedCountries"
      [saving]="store.saving()"
      (countryAdded)="restrictCountry($event)"
      (countryRemoved)="allowCountry($event)"
    />
  </sh-section>

  <sh-section heading="Pilots" icon="group" [count]="store.users().length">
    <sh-pilots-table
      [users]="store.users()"
      [blockedCountries]="settings.blockedCountries"
      [defaultLimitBytes]="settings.defaultStorageQuotaBytes"
      [saving]="store.saving()"
      (statusChanged)="setStatus($event)"
      (limitChanged)="setLimit($event)"
      (defaultLimitChanged)="setDefaultLimit($event)"
      (postsHidden)="setPostsHidden($event)"
    />
  </sh-section>
}
