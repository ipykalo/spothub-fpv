<mat-card appearance="outlined" class="tone-{{ style().tone }} flex h-full min-h-42 flex-col gap-2 px-4 pt-3.5 pb-2.5">
  <div class="flex flex-col gap-1.5">
    <h3 class="m-0 truncate text-base leading-snug font-semibold" [title]="build().name">{{ build().name }}</h3>

    <div class="flex flex-wrap items-center gap-1.5">
      <span
        class="inline-flex items-center gap-1 rounded-full bg-(--tone-surface) py-0.5 pr-2 pl-1 text-xs font-bold tracking-wide text-(--tone) uppercase"
      >
        <mat-icon class="icon-xs" aria-hidden="true">{{ style().icon }}</mat-icon>
        {{ statusLabels[build().status] }}
      </span>
    </div>
  </div>

  @if (build().coverUrl) {
    <!-- Full-bleed: the negative margin cancels the card's padding, and a
         fixed ratio keeps a row of cards aligned whatever the photo's shape. -->
    <img
      class="-mx-4 block aspect-video w-[calc(100%+2rem)] max-w-none bg-surface-high object-cover"
      [src]="build().coverUrl"
      [alt]="'Photo of ' + build().name"
      loading="lazy"
    />
  }

  <div class="min-h-6.5 flex-auto overflow-hidden">
    @if (meta().length) {
      <ul class="m-0 flex list-none flex-wrap gap-x-3 gap-y-0.5 p-0 text-sm text-muted">
        @for (item of meta(); track item) {
          <li>{{ item }}</li>
        }
      </ul>
    } @else {
      <p class="m-0 text-sm text-muted italic">No details recorded</p>
    }
  </div>

  <div class="border-t border-outline-variant pt-1.5">
    <div class="-ml-2 flex gap-0.5">
      <a matButton [routerLink]="['/hangar', build().id]">Open</a>
      <a matButton [routerLink]="['/hangar', build().id, 'edit']">Edit</a>
      <button matButton [disabled]="deleting()" (click)="delete.emit(build())">
        {{ deleting() ? 'Deleting…' : 'Delete' }}
      </button>
    </div>
  </div>
</mat-card>
