<mat-card appearance="outlined" class="tone-{{ style().tone }}">
  <div class="head">
    <h3 [title]="build().name">{{ build().name }}</h3>

    <div class="badges">
      <span class="status">
        <mat-icon aria-hidden="true">{{ style().icon }}</mat-icon>
        {{ statusLabels[build().status] }}
      </span>
    </div>
  </div>

  <div class="body">
    @if (meta().length) {
      <ul class="meta">
        @for (item of meta(); track item) {
          <li>{{ item }}</li>
        }
      </ul>
    } @else {
      <p class="none">No details recorded</p>
    }
  </div>

  <div class="foot">
    <div class="actions">
      <a matButton [routerLink]="['/hangar', build().id]">Open</a>
      <a matButton [routerLink]="['/hangar', build().id, 'edit']">Edit</a>
      <button matButton [disabled]="deleting()" (click)="delete.emit(build())">
        {{ deleting() ? 'Deleting…' : 'Delete' }}
      </button>
    </div>
  </div>
</mat-card>
