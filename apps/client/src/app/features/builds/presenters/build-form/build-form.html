<mat-card appearance="outlined" class="max-w-176">
  <mat-card-header>
    <mat-card-title>{{ isEdit() ? 'Edit build' : 'New build' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form class="grid gap-2" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Mark4 5-inch" />
        @if (form.controls.name.hasError('required')) {
          <mat-error>Give the build a name</mat-error>
        }
      </mat-form-field>

      <div class="grid grid-cols-[repeat(auto-fit,minmax(12rem,1fr))] gap-2">
        <sh-autocomplete formControlName="buildClass" label="Class" emptyLabel="Unspecified" [options]="classOptions" />
        <sh-autocomplete formControlName="status" label="Status" [options]="statusOptions" />
        <sh-autocomplete formControlName="visibility" label="Visibility" [options]="visibilityOptions" />

        <mat-form-field>
          <mat-label>All-up weight (g)</mat-label>
          <input matInput type="number" formControlName="weightG" min="1" />
        </mat-form-field>
      </div>

      <mat-checkbox formControlName="hasGps">Has GPS</mat-checkbox>

      <mat-form-field>
        <mat-label>Build notes (Markdown)</mat-label>
        <textarea matInput rows="6" formControlName="descriptionMd"></textarea>
      </mat-form-field>

      @if (message(); as text) {
        <p role="alert">{{ text }}</p>
      }

      <div class="mt-4 flex gap-3">
        <button matButton="filled" type="submit" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
        <button matButton type="button" (click)="cancelled.emit()">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
