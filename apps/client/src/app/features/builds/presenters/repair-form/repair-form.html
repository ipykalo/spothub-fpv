<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field>
    <mat-label>What happened</mat-label>
    <input matInput formControlName="descriptionMd" placeholder="Caught a branch, snapped the rear-left arm" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Cause</mat-label>
    <mat-select formControlName="cause">
      @for (item of causes; track item) {
        <mat-option [value]="item">{{ causeLabels[item] }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>When</mat-label>
    <input matInput type="date" formControlName="occurredOn" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Cost</mat-label>
    <input matInput type="number" formControlName="cost" min="0" step="0.01" />
    <mat-hint>Beyond the parts themselves</mat-hint>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Currency</mat-label>
    <input matInput formControlName="currency" maxlength="3" />
  </mat-form-field>

  <button matButton="filled" type="submit" [disabled]="saving()">
    <mat-icon>add</mat-icon>
    Log
  </button>
</form>

@if (error) {
  <p role="alert">{{ error }}</p>
}
