@if (auth.isAuthenticated()) {
  <mat-toolbar>
    <a class="shrink-0 font-semibold text-inherit no-underline" routerLink="/hangar">SpotHub FPV</a>
    <!--
      On a phone the links scroll sideways rather than pushing the page wider than the screen,
      with no scrollbar drawn: overflow-x alone turns overflow-y to auto too, and Windows then
      paints both bars inside the toolbar. On wider screens nothing overflows at all.
    -->
    <nav
      class="ml-2 flex min-w-0 gap-1 min-[40rem]:ml-6 max-[40rem]:overflow-x-auto max-[40rem]:overflow-y-hidden max-[40rem]:[scrollbar-width:none]"
    >
      <a matButton routerLink="/hangar">
        Hangar
        @if (comments.unread().builds.total; as unread) {
          <span
            class="ml-1 inline-grid min-w-5 place-items-center rounded-full bg-(--mat-sys-primary) px-1.5 text-xs leading-5 font-bold text-(--mat-sys-on-primary)"
            [attr.aria-label]="unread + (unread === 1 ? ' unread comment' : ' unread comments')"
          >
            {{ unread }}
          </span>
        }
      </a>
      <a matButton routerLink="/parts">Parts</a>
      <a matButton routerLink="/flights">Flights</a>
      <a matButton routerLink="/spots">
        Spots
        @if (comments.unread().spots.total; as unread) {
          <span
            class="ml-1 inline-grid min-w-5 place-items-center rounded-full bg-(--mat-sys-primary) px-1.5 text-xs leading-5 font-bold text-(--mat-sys-on-primary)"
            [attr.aria-label]="unread + (unread === 1 ? ' unread comment' : ' unread comments')"
          >
            {{ unread }}
          </span>
        }
      </a>
      <a matButton routerLink="/blog">Blog</a>
    </nav>
    <span class="flex-1"></span>
    <span class="max-[40rem]:hidden">{{ auth.displayName() }}</span>
    <button
      matIconButton
      type="button"
      [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggle()"
    >
      <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <button matIconButton type="button" aria-label="Sign out" (click)="signOut()">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>
} @else if (isPublicPage()) {
  <!-- What a visitor sees on a shared build or the blog: where else to look, and a way in. -->
  <mat-toolbar>
    <a class="shrink-0 font-semibold text-inherit no-underline" routerLink="/builds">SpotHub FPV</a>
    <nav class="ml-2 flex min-w-0 gap-1 min-[40rem]:ml-6">
      <a matButton routerLink="/builds">Builds</a>
      <a matButton routerLink="/blog">Blog</a>
    </nav>
    <span class="flex-1"></span>
    <button
      matIconButton
      type="button"
      [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggle()"
    >
      <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <a matButton="outlined" routerLink="/login" [queryParams]="{ returnUrl: url() }">Sign in</a>
  </mat-toolbar>
}

<main class="mx-auto max-w-6xl p-6">
  <router-outlet />
</main>
