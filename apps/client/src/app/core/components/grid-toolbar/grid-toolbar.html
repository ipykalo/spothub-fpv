<div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-2">
  <!-- The whole width on a phone, where nothing sits beside it anyway. -->
  <mat-form-field class="compact w-full min-[40rem]:w-64" subscriptSizing="dynamic">
    <mat-icon matIconPrefix aria-hidden="true">search</mat-icon>
    <input
      matInput
      autocomplete="off"
      [value]="query()"
      [placeholder]="searchLabel()"
      [attr.aria-label]="searchLabel()"
      (input)="onSearch($event)"
    />
    @if (query()) {
      <button matIconButton matIconSuffix type="button" aria-label="Clear search" (click)="clear()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <ng-content />

  <!--
    One line, always: on a phone it slides sideways rather than wrapping its
    last button onto a line of its own. No scrollbar is drawn, and overflow-x
    alone would turn overflow-y to auto too, so both are set.
  -->
  <div
    class="ml-auto flex items-center gap-1 max-[40rem]:-mx-1 max-[40rem]:w-[calc(100%+0.5rem)] max-[40rem]:flex-nowrap max-[40rem]:overflow-x-auto max-[40rem]:overflow-y-hidden max-[40rem]:px-1 max-[40rem]:[scrollbar-width:none] min-[40rem]:flex-wrap"
    role="group"
    aria-label="Sort"
  >
    <span class="mr-1 text-sm text-muted">Sort</span>
    @for (option of sorts(); track option.key) {
      <button
        type="button"
        [matButton]="sort().key === option.key ? 'tonal' : 'text'"
        [attr.aria-pressed]="sort().key === option.key"
        (click)="sortBy(option)"
      >
        {{ option.label }}
        @if (sort().key === option.key) {
          <mat-icon iconPositionEnd [attr.aria-label]="sort().direction === 'asc' ? 'ascending' : 'descending'">{{
            sort().direction === 'asc' ? 'arrow_upward' : 'arrow_downward'
          }}</mat-icon>
        }
      </button>
    }
  </div>

  @if (shown() !== null && total() !== null && shown() !== total()) {
    <span class="text-sm text-muted tabular-nums" aria-live="polite">{{ shown() }} of {{ total() }}</span>
  }
</div>
