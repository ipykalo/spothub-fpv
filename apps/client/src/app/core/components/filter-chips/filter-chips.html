<mat-chip-listbox [attr.aria-label]="ariaLabel()" (change)="onChange($event)">
  <mat-chip-option [selected]="selected() === null" [value]="null">{{ allLabel() }}</mat-chip-option>

  @for (option of options(); track option.value) {
    <mat-chip-option [selected]="selected() === option.value" [value]="option.value">
      <!--
        Icon and label in one inline-flex row. Placed straight into the chip,
        the icon sat on the text baseline and rode visibly above the label.
      -->
      <span class="inline-flex items-center gap-1">
        @if (option.icon; as glyph) {
          <mat-icon class="icon-sm opacity-85" aria-hidden="true">{{ glyph }}</mat-icon>
        }
        {{ option.label }}
      </span>
    </mat-chip-option>
  }
</mat-chip-listbox>
